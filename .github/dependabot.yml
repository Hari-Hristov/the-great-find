version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # All action pins are commit SHAs. Dependabot detects that style
    # automatically and PRs SHA bumps with `# vX.Y.Z` version comments —
    # no extra config needed. Grouping keeps the noise down: one weekly
    # PR bumping every action, instead of six separate ones every time
    # GitHub does a security sweep.
    groups:
      actions:
        patterns:
          - "*"
