name: Claude Code Review

on:
  # Manual trigger. Takes the PR number because there is no PR context on a
  # workflow_dispatch run. Only shows up in the Actions UI once this file is
  # on the default branch.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
  # Deliberately no `synchronize` — that fires on every push to an open PR and
  # a full review run costs ~15 minutes. Review on arrival, then on demand.
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    # Bot-authored PRs (dependabot, renovate, flux) run without access to repo
    # secrets, so CLAUDE_CODE_OAUTH_TOKEN resolves to empty and the action
    # fails the check. Skip them rather than failing them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post the review
      issues: write # Review comments are posted through the issues API
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # On a manual run there is no PR head to check out, so fetch the
          # merge ref explicitly. Empty string keeps the default behaviour.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || '' }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ inputs.pr_number || github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
