name: Dependency Review

on:
  pull_request:
    paths:
      - "backend/go.mod"
      - "backend/go.sum"
      - "frontend/package.json"
      - "frontend/package-lock.json"

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure
